plugins {
    id 'java'
    id "com.vanniktech.maven.publish" version "0.37.0"
}

group = 'dev.zeith.lzvm'
version = lzVmVersion
description = 'Bare-bone runtime for LzVM expressions.'

subprojects {
    apply plugin: 'java'
    apply plugin: 'com.vanniktech.maven.publish'

    group = rootProject.group
    version = rootProject.version

    java {
        withSourcesJar()
        toolchain {
            languageVersion = JavaLanguageVersion.of(javaVersion)
        }
    }

    repositories {
        mavenCentral()
    }

    dependencies {
        compileOnly "org.projectlombok:lombok:$lombok"
        annotationProcessor "org.projectlombok:lombok:$lombok"
        implementation("org.jetbrains:annotations:$jbAnnotation")
    }
}

java {
    withSourcesJar()
    toolchain {
        languageVersion = JavaLanguageVersion.of(javaVersion)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    compileOnly "org.projectlombok:lombok:$lombok"
    annotationProcessor "org.projectlombok:lombok:$lombok"

    implementation("org.ow2.asm:asm:$owasm")
    implementation("org.ow2.asm:asm-tree:$owasm")
    implementation("org.jetbrains:annotations:$jbAnnotation")
}

mavenPublishing {
    publishToMavenCentral()

    signAllPublications()

    coordinates(group, 'LzVM', version)

    pom {
        name = 'LzVM'
        description = 'Bare-bone runtime for LzVM expressions.'
        url = 'https://github.com/ZeithLibs/LzVM'

        licenses {
            license {
                name = 'Zeith Standard Free License'
                url = 'https://zeith.dev/license/zsfl'
            }
        }

        scm {
            connection = 'scm:git:git://github.com/ZeithLibs/LzVM.git'
            developerConnection = 'scm:git:ssh://git@github.com/ZeithLibs/LzVM.git'
            url = 'https://github.com/ZeithLibs/LzVM'
        }

        developers {
            developer {
                id = 'zeith'
                name = 'Zeith'
            }
        }
    }
}